<!DOCTYPE html>
<html>
    <head>
        <title>shell test</title>
        <link rel="stylesheet" href="/static/styles.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/xterm/4.18.0/xterm.min.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/python/python.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/4.18.0/xterm.min.js"></script>
    </head>
    <body>
        <textarea id="codeViewer"></textarea>
        {% comment %} test code for now, will use jinja for different projects soon {% endcomment %}
        <script>
            const editor = CodeMirror.fromTextArea(document.getElementById('codeViewer'), {
                mode: "python",
                theme: "default", 
                lineNumbers: true,
                readOnly: true
            });

            fetch('/get_code?file=example.py')
                .then(response => response.text())
                .then(code => editor.setValue(code));
        </script>

        <div id="terminal" style="height: 300px; width: 80%"></div>

        <script>
            const term = new Terminal();
            term.open(document.getElementById('terminal'));

            const socket = new WebSocket('ws://localhost:7272/shell');
            socket.onmessage = (event) => term.write(event.data);
            term.onData(data => socket.send(data));
        </script>
    </body>
</html>
