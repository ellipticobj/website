<!DOCTYPE html>
<html>
    <head>
        <title>projects</title>
        <link rel="stylesheet" href="/static/styles.css">
    </head>
    <body>
        <header>
            <h1>projects!</h1>
        </header>
        <section id="projects">
            <div class="list">
                {% for project in projects %}
                <div class="listitem" onclick="window.location.href='{{ project.github }}';">
                    <h3>{{ project.name }}</h3>
                    <p>{{ project.description }}</p>
                    {% if project.pypi %}
                    <a href="{{ project.pypi }}" target="_blank">pypi</a>
                    {% endif %}
                </div>
                {% endfor %}
            </div>
        </section>
        <footer>
            
        </footer>
    </body>
</html>
